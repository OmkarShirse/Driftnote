[package]
name = "driftnote"
version = "0.1.0"
description = "Offline Markdown and JSON Canvas notes app"
edition = "2021"

[lib]
name = "driftnote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.5", features = [] }

[dependencies]
tauri = { version = "2.1.1", features = [] }
tauri-plugin-dialog = "2.0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
notify = "6.1.1"
base64 = "0.22.1"
libc = "0.2"

