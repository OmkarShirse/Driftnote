<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Driftnote</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-type="md" data-mode="read" data-canvas-view="board">

<header id="bar">
  <div class="left-group">
    <button id="btn-toggle-files" aria-pressed="true" title="Toggle file tree">📁 Files</button>
  </div>

  <div id="title-wrap">
    <span id="title">No file open</span>
    <span id="status-badge" class="saved">Saved</span>
  </div>

  <div class="right-group">
    <button id="btn-view-mode" title="Toggle Edit / Reading view">✏️ Edit</button>
    <button id="btn-canvas-view" style="display:none" title="Toggle Canvas Board / JSON view">JSON</button>
    <button id="btn-save" title="Save file (Ctrl+S)">Save</button>
    <button id="btn-theme" title="Toggle light / dark theme">☀️ Theme</button>
    <button id="btn-toggle-info" aria-pressed="true" title="Toggle outline panel">Outline</button>
  </div>
</header>

<div id="app">
  <aside id="files">
    <div class="vault-header">
      <span class="vault-name"><span id="vault-icon">📁</span> <span id="vault-title">Workspace</span></span>
      <div style="display:flex;gap:4px">
        <button id="btn-new-note" title="New Note (+)" style="font-size:12px;padding:2px 6px">+ Note</button>
        <button id="btn-new-canvas" title="New Canvas" style="font-size:12px;padding:2px 6px">+ Canvas</button>
        <button id="btn-collapse-all" title="Collapse all folders" style="font-size:12px;padding:2px 6px">Collapse</button>
      </div>
    </div>

    <button id="btn-open-dir" class="wide btn-primary">Open folder</button>

    <div style="display:flex;align-items:center;justify-content:space-between;padding:2px 2px">
      <label style="font-size:12px;color:var(--mute);cursor:pointer;display:flex;align-items:center;gap:5px">
        <input type="checkbox" id="chk-autosave" checked> Autosave edits
      </label>
    </div>

    <div id="file-tree"></div>
  </aside>

  <main id="main">
    <div id="doc-container">
      <section id="md">
        <textarea id="ed" spellcheck="false" aria-label="Note source"></textarea>
        <article id="pv"></article>
      </section>
    </div>

    <section id="cv">
      <div id="vp"><div id="world"><svg id="edges"></svg></div></div>
      <textarea id="js" spellcheck="false" aria-label="Canvas JSON"></textarea>
      <div class="ctl">
        <button id="ac">+ Card</button>
        <button id="ag">+ Group</button>
        <button id="zo" aria-label="Zoom out">&minus;</button>
        <button id="zi" aria-label="Zoom in">+</button>
        <button id="zr">Reset view</button>
      </div>
    </section>
  </main>

  <aside id="info"></aside>
</div>

<div id="modal" hidden>
  <div class="modal-card">
    <h3 id="modal-title">Notice</h3>
    <p id="modal-desc"></p>
    <div class="modal-actions" id="modal-actions">
      <button id="modal-cancel">Cancel</button>
      <button id="modal-ok" class="btn-primary">OK</button>
    </div>
  </div>
</div>

<div id="toast" hidden></div>

<script src="vendor/marked.min.js"></script>
<script src="vendor/purify.min.js"></script>
<script src="app.js"></script>
</body>
</html>
